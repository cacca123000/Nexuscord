name: Release NexusCord

# Push a tag like v2.0.2 to publish a release. NexusCord's built-in updater
# (Tools & Backup > Updates) downloads injector.js / preload.js / renderer.js from the
# latest release and verifies them against checksums.txt before installing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test test/unit.test.mjs test/injector.test.mjs
      - run: npm run build:installer
      - name: Checksums
        shell: pwsh
        run: |
          cd dist
          $files = "injector.js","preload.js","renderer.js","NexusCord-Installer.exe"
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f }
          Set-Content -Path checksums.txt -Value $lines -Encoding ascii
          Get-Content checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NexusCord-Installer.exe
            dist/injector.js
            dist/preload.js
            dist/renderer.js
            dist/checksums.txt
