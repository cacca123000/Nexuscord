<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="nc-token" content="__NC_TOKEN__">
<title>NexusCord Installer</title>
<style>
:root {
    --accent: #7c5cff; --accent2: #3ec6ff; --ok: #3ddc97; --danger: #ff4d6d; --warn: #ffb547;
    --text: #eef0f7; --muted: #9aa0b4; --border: rgba(255,255,255,.09); --glass: rgba(24,26,38,.55);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text);
    background: #0e0f16; user-select: none; -webkit-user-select: none;
}
.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
.bg i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: float 14s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width: 300px; height: 300px; background: #7c5cff; left: -90px; top: -110px; }
.bg i:nth-child(2) { width: 260px; height: 260px; background: #3ec6ff; right: -80px; bottom: -120px; animation-delay: -5s; }
.bg i:nth-child(3) { width: 180px; height: 180px; background: #ff4dc4; right: 120px; top: -100px; opacity: .25; animation-delay: -9s; }
@keyframes float { to { transform: translate(30px, 24px) scale(1.12); } }

.win { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.titlebar { height: 38px; display: flex; align-items: center; padding: 0 6px 0 12px; gap: 8px; flex: none; }
.brand { display: flex; align-items: center; gap: 8px; flex: 1; pointer-events: none; }
.logo { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; box-shadow: 0 4px 14px rgba(124,92,255,.45); }
.logo svg { width: 13px; height: 13px; }
.brand b { font-weight: 700; font-size: 13px; letter-spacing: .2px; }
.brand small { color: var(--muted); font-size: 11px; }
.ctrl { display: flex; gap: 2px; }
.ctrl button { width: 34px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.ctrl button:hover { background: rgba(255,255,255,.08); color: var(--text); }
.ctrl button.x:hover { background: #e81123; color: #fff; }
.ctrl svg { width: 12px; height: 12px; }
body[data-host="edge"] .ctrl, body[data-host="browser"] .ctrl .min { display: none; }

main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px 14px 12px; min-height: 0; }
.panel { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); border: 1px solid var(--border); border-radius: 12px; }
.branches { display: flex; flex-direction: column; gap: 6px; padding: 6px; }
.branch { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s; }
.branch:hover { background: rgba(255,255,255,.04); }
.branch.sel { background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(62,198,255,.1)); border-color: rgba(124,92,255,.5); }
.branch.missing { opacity: .45; cursor: default; }
.radio { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
.branch.sel .radio { border-color: var(--accent2); }
.branch.sel .radio::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); }
.bname { flex: 1; min-width: 0; }
.bname b { display: block; font-size: 13px; }
.bname span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.pill { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); white-space: nowrap; }
.pill.ok { background: rgba(61,220,151,.16); color: var(--ok); }
.pill.run { background: rgba(255,181,71,.14); color: var(--warn); margin-right: -4px; }

.row { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.toggle { display: flex; align-items: center; gap: 9px; cursor: pointer; color: var(--text); }
.toggle input { display: none; }
.sw { width: 34px; height: 20px; border-radius: 999px; background: rgba(255,255,255,.14); position: relative; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle input:checked + .sw { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.toggle input:checked + .sw::after { transform: translateX(14px); }
.link { margin-left: auto; color: var(--muted); font-size: 11.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; font: inherit; }
.link:hover { color: var(--text); }

.actions { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; }
.btn { height: 38px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text); font: 600 13px/1 inherit; cursor: pointer; transition: transform .08s, filter .15s, background .15s; display: flex; align-items: center; justify-content: center; gap: 7px; }
.btn:hover:not(:disabled) { background: rgba(255,255,255,.11); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--accent), #5b8cff); border-color: transparent; color: #fff; box-shadow: 0 6px 20px rgba(124,92,255,.35); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); background: linear-gradient(135deg, var(--accent), #5b8cff); }
.btn.danger { color: #ffc2cd; border-color: rgba(255,77,109,.35); background: rgba(255,77,109,.1); }
.btn:disabled { opacity: .45; cursor: default; }

.status { min-height: 34px; padding: 8px 11px; display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--muted); }
.status.ok { color: var(--ok); border-color: rgba(61,220,151,.3); }
.status.err { color: #ff8fa3; border-color: rgba(255,77,109,.35); }
.status span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent2); animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .bg i, .spin { animation: none; } }
</style>
</head>
<body data-host="__NC_HOST__">
<div class="bg"><i></i><i></i><i></i></div>
<div class="win">
    <header class="titlebar" id="titlebar">
        <div class="brand">
            <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V5l14 14V5"/></svg></div>
            <b>NexusCord</b><small>Installer · v__NC_VERSION__</small>
        </div>
        <div class="ctrl">
            <button class="min" id="min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
            <button class="x" id="close" title="Close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.4"/></svg></button>
        </div>
    </header>
    <main>
        <div class="panel branches" id="branches" role="radiogroup"></div>
        <div class="row">
            <label class="toggle"><input type="checkbox" id="relaunch" checked><span class="sw"></span><span data-i18n="relaunch"></span></label>
            <button class="link" id="openData" data-i18n="openData"></button>
        </div>
        <div class="actions">
            <button class="btn primary" id="install" data-i18n="install"></button>
            <button class="btn" id="repair" data-i18n="repair"></button>
            <button class="btn danger" id="uninstall" data-i18n="uninstall"></button>
        </div>
        <div class="panel status" id="status"><span data-i18n="ready"></span></div>
    </main>
</div>
<script>
(() => {
    const STR = {
        en: {
            relaunch: "Relaunch Discord after completion", openData: "Open data folder",
            install: "Install / Update", repair: "Repair", uninstall: "Uninstall",
            ready: "Select a Discord installation, then choose an action.",
            installed: "Installed", notInstalled: "Not installed", notFound: "Not found", running: "Running",
            versions: "v{v} · version folders: {n}", missing: "Not detected on this PC",
            working: { install: "Closing Discord and installing NexusCord…", repair: "Repairing NexusCord…", uninstall: "Removing NexusCord…" },
            noDiscord: "No Discord installation was found in %LOCALAPPDATA%.", error: "Error: {e}",
            foreign: "Another mod is installed here - use Repair to replace it."
        },
        it: {
            relaunch: "Riavvia Discord al termine", openData: "Apri cartella dati",
            install: "Installa / Aggiorna", repair: "Ripara", uninstall: "Disinstalla",
            ready: "Seleziona un'installazione di Discord, poi scegli un'azione.",
            installed: "Installato", notInstalled: "Non installato", notFound: "Non trovato", running: "In esecuzione",
            versions: "v{v} · cartelle versione: {n}", missing: "Non rilevato su questo PC",
            working: { install: "Chiusura di Discord e installazione di NexusCord…", repair: "Riparazione di NexusCord…", uninstall: "Rimozione di NexusCord…" },
            noDiscord: "Nessuna installazione di Discord trovata in %LOCALAPPDATA%.", error: "Errore: {e}",
            foreign: "Qui è installata un'altra mod: usa Ripara per sostituirla."
        }
    };
    const L = STR[/^it\b/i.test(navigator.language) ? "it" : "en"];
    document.documentElement.lang = L === STR.it ? "it" : "en";
    const fmt = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
    document.querySelectorAll("[data-i18n]").forEach(el => (el.textContent = L[el.dataset.i18n]));

    const TOKEN = document.querySelector('meta[name="nc-token"]').content;
    const webview = window.chrome && window.chrome.webview;
    const $ = id => document.getElementById(id);
    let branches = [], selected = null, busy = false;

    async function api(path, body) {
        const res = await fetch(path, {
            method: body ? "POST" : "GET",
            headers: { "X-NC-Token": TOKEN, "Content-Type": "application/json" },
            body: body ? JSON.stringify(body) : undefined
        });
        return res.json();
    }

    function setStatus(text, kind, spinning) {
        const s = $("status");
        s.className = "panel status" + (kind ? " " + kind : "");
        s.replaceChildren();
        if (spinning) s.appendChild(Object.assign(document.createElement("div"), { className: "spin" }));
        s.appendChild(Object.assign(document.createElement("span"), { textContent: text }));
    }

    function render() {
        const host = $("branches");
        host.replaceChildren();
        for (const b of branches) {
            const el = document.createElement("div");
            el.className = "branch" + (b.found ? "" : " missing") + (selected === b.id ? " sel" : "");
            el.setAttribute("role", "radio");
            el.setAttribute("aria-checked", String(selected === b.id));
            el.tabIndex = b.found ? 0 : -1;
            const pill = b.found ? (b.installed ? `<span class="pill ok">${L.installed}</span>` : `<span class="pill">${L.notInstalled}</span>`) : `<span class="pill">${L.notFound}</span>`;
            const sub = b.found ? fmt(L.versions, { v: b.version, n: b.totalVersions }) : L.missing;
            el.innerHTML = `<div class="radio"></div><div class="bname"><b></b><span></span></div>${b.running ? `<span class="pill run">${L.running}</span>` : ""}${pill}`;
            el.querySelector("b").textContent = b.label;
            el.querySelector(".bname span").textContent = sub;
            if (b.found) {
                const pick = () => { if (!busy) { selected = b.id; render(); } };
                el.onclick = pick;
                el.onkeydown = e => (e.key === " " || e.key === "Enter") && pick();
            }
            host.appendChild(el);
        }
        const sel = branches.find(b => b.id === selected);
        $("install").disabled = busy || !sel;
        $("repair").disabled = busy || !sel;
        $("uninstall").disabled = busy || !sel || !(sel.installed || sel.patchedVersions);
    }

    async function refresh() {
        const st = await api("/api/state");
        branches = st.branches;
        if (!selected || !branches.some(b => b.id === selected && b.found)) {
            selected = (branches.find(b => b.found && b.installed) || branches.find(b => b.found) || {}).id || null;
        }
        render();
        if (!branches.some(b => b.found)) setStatus(L.noDiscord, "err");
        else {
            const sel = branches.find(b => b.id === selected);
            if (sel && sel.foreignMod) setStatus(L.foreign, "err");
        }
    }

    async function act(action) {
        if (busy || !selected) return;
        busy = true;
        render();
        setStatus(L.working[action], "", true);
        try {
            const r = await api("/api/action", { action, branch: selected, relaunch: $("relaunch").checked });
            if (r.branches) branches = r.branches;
            setStatus((r.messages || []).join(" "), r.ok ? "ok" : "err");
        } catch (e) {
            setStatus(fmt(L.error, { e: e.message }), "err");
        } finally {
            busy = false;
            render();
        }
    }

    $("install").onclick = () => act("install");
    $("repair").onclick = () => act("repair");
    $("uninstall").onclick = () => act("uninstall");
    $("openData").onclick = () => api("/api/open-data", {});
    $("min").onclick = () => webview && webview.postMessage("minimize");
    $("close").onclick = async () => {
        try { await api("/api/quit", {}); } catch {}
        if (webview) webview.postMessage("close"); else window.close();
    };
    $("titlebar").addEventListener("mousedown", e => {
        if (e.button === 0 && webview && !e.target.closest("button")) webview.postMessage("drag");
    });
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") $("close").click();
    });
    document.addEventListener("contextmenu", e => e.preventDefault());

    setInterval(() => api("/api/heartbeat").catch(() => {}), 5000);
    refresh().catch(e => setStatus(fmt(L.error, { e: e.message }), "err"));
})();
</script>
</body>
</html>
